<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grad)" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Architectural silhouette -->
  <g opacity="0.25">
    <rect x="80" y="160" width="180" height="280" fill="#ffffff" rx="4"/>
    <rect x="290" y="110" width="220" height="330" fill="#ffffff" rx="4"/>
    <rect x="540" y="180" width="180" height="260" fill="#ffffff" rx="4"/>
    <!-- Windows -->
    <rect x="110" y="190" width="40" height="50" fill="#0f172a" rx="2"/>
    <rect x="180" y="190" width="40" height="50" fill="#0f172a" rx="2"/>
    <rect x="110" y="270" width="40" height="50" fill="#0f172a" rx="2"/>
    <rect x="180" y="270" width="40" height="50" fill="#0f172a" rx="2"/>
    <rect x="330" y="150" width="50" height="60" fill="#0f172a" rx="2"/>
    <rect x="420" y="150" width="50" height="60" fill="#0f172a" rx="2"/>
    <rect x="330" y="240" width="50" height="60" fill="#0f172a" rx="2"/>
    <rect x="420" y="240" width="50" height="60" fill="#0f172a" rx="2"/>
  </g>

  <!-- Campus badge -->
  <g transform="translate(60, 50)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STUDENT HOUSING</text>
  </g>

  <!-- Vacancy Date Pill (Crucial Requirement) -->
  <g transform="translate(480, 50)">
    <rect width="260" height="36" rx="18" fill="#f59e0b" />
    <text x="24" y="23" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">VACANT: 15 JUNE 2026</text>
  </g>

  <!-- Overlay Info card -->
  <rect x="60" y="320" width="680" height="130" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.12)" />
  <text x="90" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Green Valley Suites</text>
  <text x="90" y="398" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">2BHK Shared Flat (North Gate) • Verified Senior Vacancy</text>
  <text x="90" y="425" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Ready for handover at end of semester turnover</text>
  
  <text x="610" y="375" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="end">₹5,800</text>
  <text x="610" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="end">per student / month</text>
</svg>
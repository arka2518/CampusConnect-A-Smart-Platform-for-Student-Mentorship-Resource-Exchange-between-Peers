<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mgrad_AD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#mgrad_AD)" />
  
  <!-- Subtle decorative circles -->
  <circle cx="250" cy="200" r="140" fill="rgba(255,255,255,0.06)" />
  <circle cx="250" cy="200" r="100" fill="rgba(255,255,255,0.1)" />
  
  <!-- Avatar representation -->
  <circle cx="250" cy="180" r="75" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  <text x="250" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="800" text-anchor="middle">AD</text>
  
  <!-- Senior badge -->
  <g transform="translate(160, 275)">
    <rect width="180" height="28" rx="14" fill="#10b981" />
    <text x="90" y="19" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VERIFIED SENIOR MENTOR</text>
  </g>

  <!-- Name & details -->
  <text x="250" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Ananya Deshmukh</text>
  <text x="250" y="385" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Data Science & AI</text>
  <text x="250" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">3rd Year Lead • Graduating Soon</text>
  
  <!-- Replace info prompt -->
  <text x="250" y="475" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Replace with custom image in /public/images/mentors/</text>
</svg>